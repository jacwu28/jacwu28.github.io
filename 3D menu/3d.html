<!DOCTYPE html>
<html>
<head>
    <title>NBA Photo Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column; /* stack title above gallery */
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Alice', serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .gallery {
            display: flex;
            align-items: center;
            text-align: center;
        }

        button {
            font-size: 24px;
            padding: 10px 20px;
            cursor: pointer;
            margin: 0 10px;
        }

        .preview {
            width: 80px;
            height: auto;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .preview:hover {
            opacity: 1;
        }

        #mainPhoto {
            width: 300px;
            height: auto;
            margin: 0 20px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

<h1>Photos of NBA Players</h1>

<div class="gallery">
    <button id="leftBtn">⬅️</button>
    <img id="prevPreview" class="preview" src="" alt="Previous">
    <img id="mainPhoto" src="edward1.jpg" alt="Main Photo">
    <img id="nextPreview" class="preview" src="" alt="Next">
    <button id="rightBtn">➡️</button>
</div>

<script>
    const photos = [
        "edward1.jpg",
        "book1copy.jpg",
        "book6.jpg",
        "edward3.jpg",
        "durant1.jpg",
        "lebron2.jpg",
        "durant4.jpg",
        "lebron6.jpg"
    ];

    let current = 0;

    const mainPhoto = document.getElementById("mainPhoto");
    const prevPreview = document.getElementById("prevPreview");
    const nextPreview = document.getElementById("nextPreview");

    function updateGallery() {
        // Fade main photo
        mainPhoto.style.opacity = 0;
        setTimeout(() => {
            mainPhoto.src = photos[current];
            mainPhoto.style.opacity = 1;
        }, 300);

        // Update left/right previews
        const prevIndex = (current - 1 + photos.length) % photos.length;
        const nextIndex = (current + 1) % photos.length;
        prevPreview.src = photos[prevIndex];
        nextPreview.src = photos[nextIndex];
    }

    document.getElementById("leftBtn").addEventListener("click", () => {
        current = (current - 1 + photos.length) % photos.length;
        updateGallery();
    });

    document.getElementById("rightBtn").addEventListener("click", () => {
        current = (current + 1) % photos.length;
        updateGallery();
    });

    // Initialize previews
    updateGallery();
</script>

</body>
</html>

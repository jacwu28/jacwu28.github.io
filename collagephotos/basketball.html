<!DOCTYPE html>
<html>
<head>
    <title>collage photos of basketball players</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        body {
            color: #000000;
            background-color: #87CEEB;
        }
        p.intro {
            color: #000080;
            font-family: Alice, Arial, Helvetica, sans-serif;
            font-size: 24px;
        }
        h1 {
            font-size: 36px;
            padding: 0px;
            margin: 2px;
        }
        h2 {
            font-size: 32px;
        }
        h3 {
            font-size: 28px;
        }
        h4 {
            font-size: 24px;
        }
        h5 {
            font-size: 20px;
        }
        h6 {
            font-size: 18px;
        }
        div.item{
            padding: 10px;
        }
        table{
            margin: 0 auto;
            margin-top: 10px;
        }
        td{
            font-size: 20px;
        }
        .btn{
            font-size: 20px;
            padding: 10px 20px;
            font-weight: bold;
        }
        .button1{
            color:rgb(253, 181, 48);
            background-color:rgb(135, 29, 135);
        }
        .button2{
            color:black;
            background-color:rgb(206, 17, 65);
        }
        .button3{
            color:purple;
            background-color:yellow;
        }
        .button4{
            color:rgba(10, 10, 253, 0.971);
            background-color: gray;
        }
        .image-container img {
            /* position: absolute; */
            width: 0px;
            /* height: 100%; */
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .image-container img.active {
            opacity: 1;
            width: 200px;
        }
        .pg-row{
            display: flex;
            flex-wrap: wrap;
            margin: 0 auto;
            width: 600px;
        }
        .pg-row div{
            background-size: cover;
            background-position: center;
            margin: 2px;
            position: absolute;
        }
        .img-photo{
            position:absolute;
            left: 0%;
            top: 0%;
            -webkit-transition: all 1500ms ease;
            -webkit-transition: all 1500ms ease;
            -moz-transition: all 1500ms ease;
            -ms-transition: all 1500ms ease;
            -o-transition: all 1500ms ease;
            transition: all 1500ms ease;
        }
    </style>
</head>

<body>
    <div class="image-container" style="text-align: center;">
        <h1>Collage photos of NBA-players</h1>
        <div class="pg-row">
            <div id="img11" class="img-photo" style="
                width: 196px;
                height: 180px;
                top: 120px;
                left: 450px;
                background-image: url('booker/book1.jpg');
                ">
            </div>

            <div id="img12" class="img-photo" style="
                width: 196px;
                height: 180px;
                top: 120px;
                left: 650px;
                background-image: url('booker/book2.jpg');
                ">
            </div>

            <div id="img13" class="img-photo" style="
                width: 196px;
                height: 180px;
                top: 120px;
                left:850px;
                background-image: url('booker/book3.jpg');
                ">
            </div>

            <div id="img14" class="img-photo" style="
                width: 596px;
                height: 280px;
                top:305px;
                left: 450px;
                background-image: url('booker/book4.jpg');
                ">
            </div>

            <div id="img15" class="img-photo" style="
                width: 296px;
                height: 200px;
                top: 590px;
                left: 750px;
                background-image: url('booker/book5.jpg');
                ">
            </div>

            <div id="img16" class="img-photo" style="
                width: 296px;
                height: 200px;
                top: 590px;
                left:450px;
                background-image: url('booker/book6.jpg');
                ">
            </div>
        </div>

        <div style="margin: 0 auto; margin-top: 10px;">
            <button id="button1" class="btn button1" onclick="animateImages(1);">Devin Booker</button>
            <button id="button2" class="btn button2" onclick="animateImages(2);">Kevin Durant</button>
            <button id="button3" class="btn button3" onclick="animateImages(3);">Lebron James</button>
            <button id="button4" class="btn button4" onclick="animateImages(4);">Anothny Edwards</button>
        </div>
    </div>
    <script>
        const img11 = document.getElementById('img11');
        const img12 = document.getElementById('img12');
        const img13 = document.getElementById('img13');
        const img14 = document.getElementById('img14');
        const img15 = document.getElementById('img15');
        const img16 = document.getElementById('img16');

        function animateImages(gridId){
            img11.style.left='-20%';
            img11.style.right='100%';
            img12.style.top='-30%';
            img12.style.bottom='100%';
            img13.style.left='100%';
            img13.style.right='-20%';
            img14.style.top='100%';
            img14.style.bottom='-20%';
            img15.style.left='-30%';
            img15.style.right='110%';
            img16.style.left='100%';
            img16.style.right='-20%';
            setTimeout(function() {
                console.log(gridId);
                if(gridId == 1){
                    grid1on();
                }
                else if(gridId == 2){
                    grid2on();
                }
                else if(gridId == 3){
                    grid3on();
                }
                else if(gridId == 4){
                    grid4on();
                }

                img11.style.left='450px';
                img11.style.right='0%';
                img12.style.top='120px';
                img12.style.bottom='0%';
                img13.style.left='850px';
                img13.style.right='0%';
                img14.style.top="305px";
                img14.style.bottom='0%';
                img15.style.left='750px';
                img15.style.right='0%';
                img16.style.left='450px';
                img16.style.right='0%';
            }, 2000); // 2000 milliseconds = 2 second
        }
        function grid1on(){
            img11.style.backgroundImage = "url('booker/book1.jpg')";
            img12.style.backgroundImage = "url('booker/book2.jpg')";
            img13.style.backgroundImage = "url('booker/book3.jpg')";
            img14.style.backgroundImage = "url('booker/book4.jpg')";
            img15.style.backgroundImage = "url('booker/book5.jpg')";
            img16.style.backgroundImage = "url('booker/book6.jpg')";
        }
        function grid2on(){
            img11.style.backgroundImage = "url('durant/durant1.jpg')";
            img12.style.backgroundImage = "url('durant/durant2.jpg')";
            img13.style.backgroundImage = "url('durant/durant3.jpg')";
            img14.style.backgroundImage = "url('durant/durant4.jpg')";
            img15.style.backgroundImage = "url('durant/durant5.jpg')";
            img16.style.backgroundImage = "url('durant/durant6.jpg')";
        }
        function grid3on(){
            img11.style.backgroundImage = "url('lebron/lebron1.jpg')";
            img12.style.backgroundImage = "url('lebron/lebron2.jpg')";
            img13.style.backgroundImage = "url('lebron/lebron3.jpg')";
            img14.style.backgroundImage = "url('lebron/lebron4.jpg')";
            img15.style.backgroundImage = "url('lebron/lebron5.jpg')";
            img16.style.backgroundImage = "url('lebron/lebron6.jpg')";
        }
        function grid4on(){
            img11.style.backgroundImage = "url('edwards/edward1.jpg')";
            img12.style.backgroundImage = "url('edwards/edward2.jpg')";
            img13.style.backgroundImage = "url('edwards/edward3.jpg')";
            img14.style.backgroundImage = "url('edwards/edward4.jpg')";
            img15.style.backgroundImage = "url('edwards/edward5.jpg')";
            img16.style.backgroundImage = "url('edwards/edward6.jpg')";
        }
    </script>
</body>
</html>
